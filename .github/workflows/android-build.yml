name: Android build

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK command-line tools
        id: android-sdk
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          accept-android-sdk-licenses: true
          packages: 'platform-tools'
      - name: Diagnose Android SDK availability
        if: always()
        run: |
          echo "::notice title=Android SDK setup::setup=${{ steps.android-sdk.outcome }} ANDROID_HOME=${ANDROID_HOME:-unset} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          if [[ -n "${ANDROID_HOME:-}" ]]; then ls -la "$ANDROID_HOME" || true; fi
          command -v sdkmanager || true
      - name: Install Android API 35 build tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9 (open-source cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-provider: basic
      - name: Run Android unit-test task and build APKs
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleRelease
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: goldlens-android-apks
          if-no-files-found: error
          retention-days: 30
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
