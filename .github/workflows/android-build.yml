name: Android build

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate runner-provided Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$sdk_root" ]]; then
            echo "Android SDK was not present at $sdk_root" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          for candidate in "$sdk_root/cmdline-tools/latest/bin" "$sdk_root/cmdline-tools/bin" "$sdk_root/tools/bin"; do
            if [[ -x "$candidate/sdkmanager" ]]; then
              echo "$candidate" >> "$GITHUB_PATH"
              break
            fi
          done
          echo "SDK root: $sdk_root"
          find "$sdk_root" -maxdepth 3 -type f -name sdkmanager -print
          command -v sdkmanager
      - name: Install Android API 35 build tools
        run: sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9 (open-source cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-provider: basic
      - name: Run Android unit-test task and build APKs
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleRelease
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: goldlens-android-apks
          if-no-files-found: error
          retention-days: 30
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
