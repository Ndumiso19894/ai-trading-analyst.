name: Android build

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Optional verified HTTPS backend URL; if supplied, the workflow smoke-tests it before packaging'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK command-line tools
        id: android-sdk
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          accept-android-sdk-licenses: true
          packages: 'platform-tools'
      - name: Diagnose Android SDK availability
        if: always()
        run: |
          echo "::notice title=Android SDK setup::setup=${{ steps.android-sdk.outcome }} ANDROID_HOME=${ANDROID_HOME:-unset} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          if [[ -n "${ANDROID_HOME:-}" ]]; then ls -la "$ANDROID_HOME" || true; fi
          command -v sdkmanager || true
      - name: Install Android API 35 build tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Smoke-test public HTTPS API before building phone APK
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.backend_url != ''
        env:
          BACKEND_URL: ${{ github.event.inputs.backend_url || '' }}
        run: python3 scripts/smoke_live_api.py
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare owner-controlled release signing key (optional)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/goldlens-release.jks"
            chmod 600 "$RUNNER_TEMP/goldlens-release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/goldlens-release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Owner release signing key configured."
          else
            echo "No owner release key configured; release APK will be unsigned."
          fi
      - name: Run Android unit-test task and build APKs
        id: gradle-build
        working-directory: android
        shell: bash
        env:
          BACKEND_URL: ${{ github.event.inputs.backend_url || '' }}
        run: |
          set +e
          if [[ -n "$BACKEND_URL" && ! "$BACKEND_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?/?$ ]]; then
            echo "::error::APK backend URL must use HTTPS"
            exit 2
          fi
          if [[ -z "$BACKEND_URL" ]]; then
            echo "No hosted API supplied; building the offline-capable APK with no server default."
          else
            echo "Embedding smoke-tested backend URL: $BACKEND_URL"
          fi
          gradle --no-daemon --stacktrace -PbackendBaseUrl="$BACKEND_URL" testDebugUnitTest assembleDebug assembleRelease > "$RUNNER_TEMP/android-gradle.log" 2>&1
          result=$?
          if [[ $result -ne 0 ]]; then
            grep -R -H '<failure' app/build/test-results/testDebugUnitTest >> "$RUNNER_TEMP/android-gradle.log" || true
          fi
          tail -n 120 "$RUNNER_TEMP/android-gradle.log"
          if [[ $result -ne 0 ]]; then
            details=$(grep -E '(^e: |error:|What went wrong:|Execution failed|Could not |Failed to |^> |^\* Exception is:)' "$RUNNER_TEMP/android-gradle.log" | tail -n 35 | tr '\n' ' ' | cut -c1-5000)
            echo "::error title=Android Gradle failure::$details"
          fi
          exit $result
      - name: Upload Android test reports for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          if-no-files-found: ignore
          retention-days: 7
          path: android/app/build/reports/tests/testDebugUnitTest/
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: goldlens-android-apks
          if-no-files-found: error
          retention-days: 30
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release*.apk
